name: Website

# Builds the website (site/) on pull requests to check it, and publishes it to
# GitHub Pages from main. One-time setup: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default; only the deploy job can write to Pages.
permissions:
  contents: read

# One deployment at a time; a newer push to main waits for the current one rather than cancelling it.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and check the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install the library's dependencies
        run: npm ci
      - name: Install the website's dependencies
        run: npm ci --prefix site
      - name: Generate the component reference, so its examples are tested too
        run: npm run site:docs
      - name: Website examples and documentation snippets
        run: npx vitest run test/site.test.ts
      - name: Type-check the website
        run: npm --prefix site run typecheck
      - name: Build the website
        run: npm run site:build
        env:
          # Public settings for the playground's Generate box (Settings → Secrets and variables → Actions → Variables).
          # Leave them unset and the site runs saved specs only. The API key is never here: it lives in the worker.
          VITE_SAYSHAPE_MODEL_ENDPOINT: ${{ vars.SAYSHAPE_MODEL_ENDPOINT }}
          VITE_SAYSHAPE_MODEL_LABEL: ${{ vars.SAYSHAPE_MODEL_LABEL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
      - name: Install Chromium for the page checks
        run: npx playwright install --with-deps chromium
      - name: Check links, assets, secrets and every page in a browser
        run: npm run site:check -- --browser
      - name: Upload the site for Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
