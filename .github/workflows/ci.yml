name: CI

on:
  push:
    branches: [main]
  pull_request:
    # "labeled" lets the update-visual-baselines label regenerate baselines (see the visual job).
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      update-baselines:
        description: "Regenerate the visual baselines and commit them to the branch"
        type: boolean
        default: false

concurrency:
  # Label events get their own group so they don't cancel a run in progress.
  group: ci-${{ github.ref }}-${{ github.event.action == 'labeled' && 'label' || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test and build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run docs:check
      - run: npm run build:playground

  mcp:
    name: MCP server (mcp/)
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  fuzz:
    name: Long fuzz run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/fuzz.test.ts
        env:
          FUZZ_RUNS: "5000"

  bench:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event.action != 'labeled'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run bench -- --outputJson bench.json
      - name: Benchmark the base branch on the same machine
        if: github.event_name == 'pull_request'
        run: |
          git worktree add ../base "${{ github.event.pull_request.base.sha }}"
          if [ -f ../base/bench/engine.bench.ts ]; then
            (cd ../base && npm ci && npm run bench -- --outputJson "$GITHUB_WORKSPACE/bench-base.json")
          fi
      - name: Compare
        if: github.event_name == 'pull_request'
        run: npx vite-node scripts/compare-bench.ts bench-base.json bench.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ github.sha }}
          path: bench.json
          retention-days: 90

  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    # A label event only matters for the update label; don't re-run for others.
    if: github.event.action != 'labeled' || github.event.label.name == 'update-visual-baselines'
    # Baselines are made in this same image (npm run test:visual:docker), so fonts render identically.
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: write
      pull-requests: write
    env:
      HOME: /root
      # Regenerate and commit baselines on a manual run with update-baselines, or when a
      # pull request from this repository carries the update-visual-baselines label.
      UPDATE: ${{ inputs.update-baselines || (github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'update-visual-baselines')) }}
    steps:
      - name: Install git (needed to commit baselines)
        run: command -v git || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v4
        with:
          # To commit, check out the pull request's branch rather than the merge commit.
          ref: ${{ env.UPDATE == 'true' && github.event.pull_request.head.ref || '' }}
      - run: npm ci
      - name: Compare with baselines
        if: env.UPDATE != 'true'
        run: npx playwright test
      - name: Regenerate baselines
        if: env.UPDATE == 'true'
        run: npx playwright test --update-snapshots
      - name: Commit regenerated baselines
        if: env.UPDATE == 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            git commit -m "Update visual baselines" -m "Regenerated by CI in the Playwright image."
            git push
            echo "Committed regenerated baselines. Review the images in the pull request diff." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Remove the update label, so later pushes are compared again
        if: env.UPDATE == 'true' && github.event_name == 'pull_request'
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/update-visual-baselines" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            playwright-report/
            test-results/
          retention-days: 14
